spring.application.name=MigrationApplication

# Server Configuration
server.port=8081

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ace_mig_master?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
   
# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# =======================
# Kafka Configuration
# =======================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cust-migration-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer Configuration (if needed)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Optional Admin Configuration (for creating topics)
spring.kafka.admin.auto-create-topics=true

# Logging Levels for Debugging Kafka
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG

# Let Kafka know how to deserialize your class
spring.kafka.consumer.properties.spring.json.trusted.packages=*

